<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Video Tuner</title>
  </head>
  <body>
    <header>
      <h1>Video Tuner</h1>
      <span id="status" class="status">—</span>
    </header>

    <section class="control">
      <div class="row">
        <label for="speed">Velocidade</label>
        <output id="speedOut">1.00x</output>
      </div>
      <input id="speed" type="range" min="0.25" max="4" step="0.05" value="1" />
      <div class="presets" data-target="speed">
        <button data-value="0.5">0.5x</button>
        <button data-value="1">1x</button>
        <button data-value="1.25">1.25x</button>
        <button data-value="1.5">1.5x</button>
        <button data-value="2">2x</button>
        <button data-value="3">3x</button>
      </div>
    </section>

    <section class="control">
      <div class="row">
        <label for="volume">Volume</label>
        <output id="volumeOut">100%</output>
      </div>
      <input id="volume" type="range" min="0" max="600" step="5" value="100" />
      <div class="presets" data-target="volume">
        <button data-value="0">Mudo</button>
        <button data-value="100">100%</button>
        <button data-value="200">200%</button>
        <button data-value="400">400%</button>
        <button data-value="600">600%</button>
      </div>
      <p class="hint">Acima de 100% o audio e amplificado via WebAudio.</p>
    </section>

    <footer>
      <label class="check">
        <input id="perSite" type="checkbox" />
        Lembrar por site
      </label>
      <button id="reset" class="ghost">Resetar</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
