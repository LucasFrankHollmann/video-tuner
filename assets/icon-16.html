<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video Tuner — icon 16</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      svg {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!--
      Versao para 16px: sem a trilha esmaecida e sem o miolo do botao, que
      somem ou viram sujeira nesse tamanho. Tracos mais grossos e play maior.
    -->
    <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7d97ff" />
          <stop offset="1" stop-color="#3f4bb0" />
        </linearGradient>
      </defs>

      <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#bg)" />

      <path
        d="M 33.6 94.4 A 43 43 0 1 1 94.4 33.6"
        fill="none"
        stroke="#fff"
        stroke-width="13"
        stroke-linecap="round"
      />

      <path
        d="M 50 42 L 86 64 L 50 86 Z"
        fill="#fff"
        stroke="#fff"
        stroke-width="8"
        stroke-linejoin="round"
      />
    </svg>
  </body>
</html>
