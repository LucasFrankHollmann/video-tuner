<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video Tuner — small promo tile</title>
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: radial-gradient(circle at 50% 12%, #2b3358 0%, #12121a 70%);
        color: #f2f2f5;
        font: 15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
        text-align: center;
      }

      .mark {
        width: 76px;
        height: 76px;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: -0.4px;
      }

      p {
        margin: 0;
        font-size: 14px;
        color: #a9b0c8;
      }

      .chips {
        display: flex;
        gap: 7px;
        margin-top: 4px;
      }

      .chips span {
        padding: 4px 10px;
        border: 1px solid #343b58;
        border-radius: 999px;
        background: rgba(108, 140, 255, 0.12);
        font-size: 12px;
        font-weight: 600;
        color: #b8c4ff;
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7d97ff" />
          <stop offset="1" stop-color="#3f4bb0" />
        </linearGradient>
      </defs>
      <rect width="128" height="128" rx="29" fill="url(#bg)" />
      <path
        d="M 35.72 92.28 A 40 40 0 1 1 92.28 92.28"
        fill="none"
        stroke="#fff"
        stroke-opacity="0.32"
        stroke-width="9"
        stroke-linecap="round"
      />
      <path
        d="M 35.72 92.28 A 40 40 0 1 1 92.28 35.72"
        fill="none"
        stroke="#fff"
        stroke-width="9"
        stroke-linecap="round"
      />
      <circle cx="92.28" cy="35.72" r="10.5" fill="#fff" />
      <circle cx="92.28" cy="35.72" r="4" fill="#4a56b5" />
      <path
        d="M 52 45 L 82 64 L 52 83 Z"
        fill="#fff"
        stroke="#fff"
        stroke-width="6"
        stroke-linejoin="round"
      />
    </svg>

    <h1>Video Tuner</h1>
    <p>Speed and volume, right on the video</p>

    <div class="chips">
      <span>up to 8x</span>
      <span>up to 600%</span>
    </div>
  </body>
</html>
