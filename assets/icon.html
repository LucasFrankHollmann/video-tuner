<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video Tuner — icon</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      /* Escala para o tamanho da janela: o mesmo arquivo serve 48, 128 e 512. */
      svg {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7d97ff" />
          <stop offset="1" stop-color="#3f4bb0" />
        </linearGradient>
      </defs>

      <rect x="0" y="0" width="128" height="128" rx="29" fill="url(#bg)" />

      <!-- Trilha do mostrador -->
      <path
        d="M 35.72 92.28 A 40 40 0 1 1 92.28 92.28"
        fill="none"
        stroke="#fff"
        stroke-opacity="0.32"
        stroke-width="9"
        stroke-linecap="round"
      />
      <!-- Valor ajustado -->
      <path
        d="M 35.72 92.28 A 40 40 0 1 1 92.28 35.72"
        fill="none"
        stroke="#fff"
        stroke-width="9"
        stroke-linecap="round"
      />
      <!-- Botao do mostrador -->
      <circle cx="92.28" cy="35.72" r="10.5" fill="#fff" />
      <circle cx="92.28" cy="35.72" r="4" fill="#4a56b5" />

      <!-- Play -->
      <path
        d="M 52 45 L 82 64 L 52 83 Z"
        fill="#fff"
        stroke="#fff"
        stroke-width="6"
        stroke-linejoin="round"
      />
    </svg>
  </body>
</html>
